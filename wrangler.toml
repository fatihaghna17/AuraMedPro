name = "auramedpro"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# R2 Bucket Binding
[[r2_buckets]]
binding = "QUESTIONS_BUCKET"
bucket_name = "auramedpro-questions"  # GANTI dengan nama bucket R2 yang aktif

# Environment Variables
[vars]
R2_PUBLIC_URL = "https://public-dev-url.auramedpro.workers.dev"  # GANTI dengan R2 public URL yang aktif

# Secret environment variables (set via CLI, bukan di file ini)
# GEMINI_API_KEY, R2_SECRET_TOKEN, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# Set dengan: wrangler secret put GEMINI_API_KEY
